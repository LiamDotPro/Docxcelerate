# Publishes the framework to npm when it changes on main.
#
# Authentication is npm trusted publishing: the job asks GitHub for a
# short-lived OIDC token and npm exchanges it for publish rights. There is no
# npm token in this repository and nothing to rotate — which is the point, as
# an interactive OTP cannot reach a CI runner.
#
# It needs two things set up outside this file:
#
#   1. The package must already exist on npm. A trusted publisher is configured
#      per package, so the very first publish of a new name is a manual one.
#   2. On npmjs.com -> the package -> Settings -> Trusted publishers, add this
#      repository (LiamDotPro/Docxcelerate) and this workflow's filename
#      (release.yml).
#
# Provenance is skipped while the repository is private: npm signs it into a
# public transparency log and refuses to do so for a private repo. It turns
# itself on when the repository goes public.
#
# Only the framework triggers this. The site lives in website/ and deploys
# itself, so its changes never cut a release.
#
# The version in package.json decides whether anything is released. Bump it in
# the pull request that earns the bump, and merging it ships exactly that
# version; leave it alone and the job stops before publishing. Nothing here
# writes a version or pushes a commit to main, so what ships is always a number
# somebody chose on purpose and reviewed.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "bin/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.build.json"
  # For re-running a release whose publish failed after the version was merged.
  workflow_dispatch:

# One release at a time, so two runs cannot race to publish the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag and write the release
      id-token: write # mint the OIDC token npm trades for publish rights
    steps:
      - uses: actions/checkout@v7
        with:
          # `gh release --generate-notes` writes from the commits and tags since
          # the last release, and a shallow cut does not have them.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing landed in npm 11.5.1; the npm bundled with Node may
      # be older than that.
      - name: Use an npm that can publish through OIDC
        run: npm install -g npm@latest

      # `registry-url` above writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # into .npmrc, unconditionally. With no token — which is the whole point of
      # trusted publishing — that line expands to an empty string, npm decides
      # authentication is already configured, and never asks GitHub for the OIDC
      # token. The publish then fails with ENEEDAUTH while looking like a
      # credentials problem rather than a config one.
      #
      # `registry-url` is still worth keeping: it is what points the registry at
      # npmjs.org. Only the token line has to go.
      - name: Clear the empty auth line that would suppress OIDC
        run: |
          set -euo pipefail
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

          # An `if` rather than `[ -f ] && sed`, which would exit non-zero and
          # fail the step on the day the file is not there.
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
            echo "Cleared the auth line. $npmrc now reads:"
            cat "$npmrc"
          else
            echo "No $npmrc to clear."
          fi

      # Ahead of the release decision, and deliberately not skipped when there
      # is nothing to publish: this is what runs the suite against main. The JSR
      # release in release-jsr.yml runs it too, for the same reason — neither
      # publish should be the first thing to find out the tests are red.
      - run: npm ci

      - run: npm test

      # Whether there is anything to release, asked of the registry rather than
      # of the diff.
      #
      # "Has the version changed?" and "is this version unpublished?" agree on
      # every push that matters, and differ on the one that does: a release
      # whose publish failed after the bump was merged. The diff would call that
      # unchanged and never retry; the registry knows the version is still
      # missing and lets the next push finish the job.
      - name: Decide whether to release
        id: version
        run: |
          set -euo pipefail

          name=$(node -p "require('./package.json').name")
          current=$(node -p "require('./package.json').version")

          # Prints nothing for a version that is not published, and fails for a
          # package that does not exist at all. Both mean "nothing has shipped
          # under this number yet".
          published=$(npm view "$name@$current" version 2>/dev/null || true)

          if [ -n "$published" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$name@$current is already published — nothing to release."
            echo "Bump the version in package.json to ship a new build." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$current" >> "$GITHUB_OUTPUT"
          echo "$name@$current is not published — releasing it."
          echo "Releasing $name@$current." >> "$GITHUB_STEP_SUMMARY"

      # Publish before tagging: a failure here leaves no tag pointing at a
      # release that does not exist.
      #
      # No NODE_AUTH_TOKEN here on purpose. Setting it to an unset secret is not
      # a harmless default: an empty value is what stopped OIDC from running at
      # all. If a token is ever needed instead, add it back along with removing
      # the step that clears the auth line.
      - name: Publish to npm
        if: steps.version.outputs.release == 'true'
        run: npm publish --access public ${{ github.event.repository.private && '' || '--provenance' }}

      # The tag names the commit that was already on main, so there is nothing
      # to push but the tag itself.
      - name: Tag the released commit
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      - name: Write the GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.version.outputs.version }}" --generate-notes
